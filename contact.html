<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact — small human gift</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-section {
            max-width: 500px;
            margin-top: 60px;
        }
        .contact-section label {
            display: block;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: lowercase;
            color: #9a8f85;
            margin-bottom: 6px;
            margin-top: 20px;
        }
        .contact-section input,
        .contact-section textarea {
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            color: #362b28;
            background: none;
            border: 1px solid #d8cfc3;
            padding: 10px;
        }
        .contact-section textarea {
            min-height: 120px;
            resize: vertical;
        }
        .contact-section button {
            margin-top: 24px;
            font-size: 14px;
            letter-spacing: 0.1em;
            text-transform: lowercase;
            color: #362b28;
            background: none;
            border: 1px solid #362b28;
            padding: 12px 24px;
            cursor: pointer;
        }
        .contact-section button:hover {
            background-color: #362b28;
            color: #f5f0e8;
        }
    </style>
</head>
<body>

    <header>
        <h1><a href="index.html">small human gift</a></h1>
        <p>a document of making</p>
        <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
        <nav>
            <a href="index.html">home</a>
            <a href="work.html">finished work</a>
            <a href="progress.html">work in progress</a>
            <a href="cv.html">cv</a>
            <a href="shop.html">shop</a>
            <a href="contact.html">contact</a>
            <a href="https://www.instagram.com/smallhumangift/" target="_blank" class="instagram-link" aria-label="Instagram">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/></svg>
            </a>
        </nav>
    </header>

    <h2 class="page-title">contact</h2>

    <div class="contact-section">
        <form action="https://formspree.io/f/xnpabzaa" method="POST">
            <label for="name">name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">your email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">send</button>
        </form>
    </div>

</body>
</html>
